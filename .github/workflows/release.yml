name: Build and Release WPForge

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (example: 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:

  # ==========================================================================
  # Prepare
  # ==========================================================================

  prepare:
    name: Prepare Release
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            echo "Version must follow semantic versioning, for example: 1.0.0"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION"
          echo "Tag: v$VERSION"


  # ==========================================================================
  # Windows
  # ==========================================================================

  build-windows:
    name: Build Windows x64
    needs: prepare
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        shell: bash
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name "WPForge-v${{ needs.prepare.outputs.version }}-Windows-x64" \
            --add-data "templates;templates" \
            main.py

      - name: Test executable
        shell: bash
        run: |
          ./dist/WPForge-v${{ needs.prepare.outputs.version }}-Windows-x64.exe --version
          ./dist/WPForge-v${{ needs.prepare.outputs.version }}-Windows-x64.exe --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wpforge-windows-x64
          path: dist/WPForge-v${{ needs.prepare.outputs.version }}-Windows-x64.exe


  # ==========================================================================
  # Linux
  # ==========================================================================

  build-linux:
    name: Build Linux x64
    needs: prepare
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        shell: bash
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name "WPForge-v${{ needs.prepare.outputs.version }}-Linux-x64" \
            --add-data "templates:templates" \
            main.py

      - name: Test executable
        run: |
          chmod +x "dist/WPForge-v${{ needs.prepare.outputs.version }}-Linux-x64"

          "./dist/WPForge-v${{ needs.prepare.outputs.version }}-Linux-x64" --version
          "./dist/WPForge-v${{ needs.prepare.outputs.version }}-Linux-x64" --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wpforge-linux-x64
          path: dist/WPForge-v${{ needs.prepare.outputs.version }}-Linux-x64


  # ==========================================================================
  # macOS Apple Silicon
  # ==========================================================================

  build-macos-arm64:
    name: Build macOS ARM64
    needs: prepare
    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        shell: bash
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name "WPForge-v${{ needs.prepare.outputs.version }}-macOS-arm64" \
            --add-data "templates:templates" \
            main.py

      - name: Test executable
        run: |
          chmod +x "dist/WPForge-v${{ needs.prepare.outputs.version }}-macOS-arm64"

          "./dist/WPForge-v${{ needs.prepare.outputs.version }}-macOS-arm64" --version
          "./dist/WPForge-v${{ needs.prepare.outputs.version }}-macOS-arm64" --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wpforge-macos-arm64
          path: dist/WPForge-v${{ needs.prepare.outputs.version }}-macOS-arm64


  # ==========================================================================
  # macOS Intel
  # ==========================================================================

  build-macos-x64:
    name: Build macOS x64
    needs: prepare
    runs-on: macos-15-intel

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        shell: bash
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name "WPForge-v${{ needs.prepare.outputs.version }}-macOS-x64" \
            --add-data "templates:templates" \
            main.py

      - name: Test executable
        run: |
          chmod +x "dist/WPForge-v${{ needs.prepare.outputs.version }}-macOS-x64"

          "./dist/WPForge-v${{ needs.prepare.outputs.version }}-macOS-x64" --version
          "./dist/WPForge-v${{ needs.prepare.outputs.version }}-macOS-x64" --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wpforge-macos-x64
          path: dist/WPForge-v${{ needs.prepare.outputs.version }}-macOS-x64


  # ==========================================================================
  # Release
  # ==========================================================================

  release:
    name: Create GitHub Release

    needs:
      - prepare
      - build-windows
      - build-linux
      - build-macos-arm64
      - build-macos-x64

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # Download artifacts
      # ----------------------------------------------------------------------

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: wpforge-windows-x64
          path: release

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: wpforge-linux-x64
          path: release

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: wpforge-macos-arm64
          path: release

      - name: Download macOS x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: wpforge-macos-x64
          path: release

      # ----------------------------------------------------------------------
      # Permissions
      # ----------------------------------------------------------------------

      - name: Make Unix binaries executable
        run: |
          chmod +x "release/WPForge-v${{ needs.prepare.outputs.version }}-Linux-x64"
          chmod +x "release/WPForge-v${{ needs.prepare.outputs.version }}-macOS-arm64"
          chmod +x "release/WPForge-v${{ needs.prepare.outputs.version }}-macOS-x64"

      # ----------------------------------------------------------------------
      # Checksums
      # ----------------------------------------------------------------------

      - name: Generate SHA256 checksums
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS.txt

      # ----------------------------------------------------------------------
      # Generate release notes
      # ----------------------------------------------------------------------

      - name: Generate release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # WPForge v${{ needs.prepare.outputs.version }} 🛠️

          ## 🇬🇧 English

          WPForge is a cross-platform CLI tool for generating WordPress plugins from the WordPress Plugin Boilerplate (WPPB).

          This release provides standalone builds for Windows, Linux, and macOS.

          ### ✨ What's Included

          - 🪟 Windows x64
          - 🐧 Linux x64
          - 🍎 macOS Intel x64
          - 🍎 macOS Apple Silicon ARM64
          - 🐍 Python source code
          - 🔐 SHA256 checksums

          ### 📥 Downloads

          Choose the executable matching your operating system and CPU architecture.

          | Platform | File |
          |---|---|
          | 🪟 Windows x64 | `WPForge-v${{ needs.prepare.outputs.version }}-Windows-x64.exe` |
          | 🐧 Linux x64 | `WPForge-v${{ needs.prepare.outputs.version }}-Linux-x64` |
          | 🍎 macOS Intel | `WPForge-v${{ needs.prepare.outputs.version }}-macOS-x64` |
          | 🍎 macOS Apple Silicon | `WPForge-v${{ needs.prepare.outputs.version }}-macOS-arm64` |
          | 🔐 Checksums | `SHA256SUMS.txt` |

          ### 🚀 Quick Start

          #### Windows

          Download:

          `WPForge-v${{ needs.prepare.outputs.version }}-Windows-x64.exe`

          Open PowerShell or Command Prompt and run:

          ```powershell
          .\WPForge-v${{ needs.prepare.outputs.version }}-Windows-x64.exe --version
          ```

          Then:

          ```powershell
          .\WPForge-v${{ needs.prepare.outputs.version }}-Windows-x64.exe new
          ```

          #### Linux

          Download:

          `WPForge-v${{ needs.prepare.outputs.version }}-Linux-x64`

          Make it executable:

          ```bash
          chmod +x WPForge-v${{ needs.prepare.outputs.version }}-Linux-x64
          ```

          Run:

          ```bash
          ./WPForge-v${{ needs.prepare.outputs.version }}-Linux-x64 --version
          ```

          Then:

          ```bash
          ./WPForge-v${{ needs.prepare.outputs.version }}-Linux-x64 new
          ```

          #### macOS Apple Silicon

          Download:

          `WPForge-v${{ needs.prepare.outputs.version }}-macOS-arm64`

          Make it executable:

          ```bash
          chmod +x WPForge-v${{ needs.prepare.outputs.version }}-macOS-arm64
          ```

          Run:

          ```bash
          ./WPForge-v${{ needs.prepare.outputs.version }}-macOS-arm64 --version
          ```

          #### macOS Intel

          Download:

          `WPForge-v${{ needs.prepare.outputs.version }}-macOS-x64`

          Make it executable:

          ```bash
          chmod +x WPForge-v${{ needs.prepare.outputs.version }}-macOS-x64
          ```

          Run:

          ```bash
          ./WPForge-v${{ needs.prepare.outputs.version }}-macOS-x64 --version
          ```

          ### 📚 Documentation

          Full documentation:

          https://github.com/alirezasayadi/WPForge

          ### 🔐 Verify Downloads

          SHA256 checksums are available in:

          `SHA256SUMS.txt`

          ---

          ## 🇮🇷 فارسی

          **WPForge** یک ابزار خط فرمان چندسکویی برای ساخت سریع افزونه‌های WordPress بر اساس ساختار WordPress Plugin Boilerplate است.

          این نسخه شامل فایل‌های اجرایی مستقل برای سیستم‌عامل‌های زیر است:

          - 🪟 Windows x64
          - 🐧 Linux x64
          - 🍎 macOS Intel x64
          - 🍎 macOS Apple Silicon ARM64

          ### 📥 دانلود

          فایل متناسب با سیستم‌عامل و معماری سیستم خود را دانلود کنید.

          ### 🪟 ویندوز

          فایل زیر را دانلود کنید:

          `WPForge-v${{ needs.prepare.outputs.version }}-Windows-x64.exe`

          سپس PowerShell یا CMD را باز کرده و اجرا کنید:

          ```powershell
          .\WPForge-v${{ needs.prepare.outputs.version }}-Windows-x64.exe --version
          ```

          برای ساخت افزونه:

          ```powershell
          .\WPForge-v${{ needs.prepare.outputs.version }}-Windows-x64.exe new
          ```

          ### 🐧 لینوکس

          فایل زیر را دانلود کنید:

          `WPForge-v${{ needs.prepare.outputs.version }}-Linux-x64`

          سپس:

          ```bash
          chmod +x WPForge-v${{ needs.prepare.outputs.version }}-Linux-x64
          ```

          اجرا:

          ```bash
          ./WPForge-v${{ needs.prepare.outputs.version }}-Linux-x64 --version
          ```

          ساخت افزونه:

          ```bash
          ./WPForge-v${{ needs.prepare.outputs.version }}-Linux-x64 new
          ```

          ### 🍎 macOS

          اگر Mac شما Apple Silicon است، فایل ARM64 را دانلود کنید.

          اگر Mac شما Intel است، فایل x64 را دانلود کنید.

          برای Apple Silicon:

          ```bash
          chmod +x WPForge-v${{ needs.prepare.outputs.version }}-macOS-arm64
          ./WPForge-v${{ needs.prepare.outputs.version }}-macOS-arm64 --version
          ```

          برای Intel:

          ```bash
          chmod +x WPForge-v${{ needs.prepare.outputs.version }}-macOS-x64
          ./WPForge-v${{ needs.prepare.outputs.version }}-macOS-x64 --version
          ```

          ### 📖 راهنمای کامل

          راهنمای کامل نصب و استفاده در README پروژه قرار دارد.

          https://github.com/alirezasayadi/WPForge

          ### 🔐 بررسی صحت فایل

          برای بررسی صحت فایل‌های دانلود شده می‌توانید SHA256 فایل را با مقدار موجود در:

          `SHA256SUMS.txt`

          مقایسه کنید.

          ---

          ## 📦 Source Code

          Source code is available in the GitHub repository.

          https://github.com/alirezasayadi/WPForge

          ## 📄 License

          WPForge is licensed under:

          **GPL-2.0-or-later**

          ---

          Made with ❤️ by Alireza Sayadi
          EOF

      # ----------------------------------------------------------------------
      # Create GitHub Release
      # ----------------------------------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "WPForge v${{ needs.prepare.outputs.version }} 🛠️"
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          draft: false
          prerelease: false
          files: |
            release/WPForge-v${{ needs.prepare.outputs.version }}-Windows-x64.exe
            release/WPForge-v${{ needs.prepare.outputs.version }}-Linux-x64
            release/WPForge-v${{ needs.prepare.outputs.version }}-macOS-arm64
            release/WPForge-v${{ needs.prepare.outputs.version }}-macOS-x64
            release/SHA256SUMS.txt
